                        爸爸每週假日都會回到苗栗顧他的山坡，顧他的南瓜、樹葡萄、魯冰花、李花……，就在他的木屋後面、踩著他自己搭的石階就能走上山，
                        他也在那玩音樂、寫書法、畫畫……那棟木屋雖然蓋得不是很安穩，但裡裡外外都承載了他大半輩子的浪漫。
                        
                        畫了他、畫了柔軟的風、畫了幾隻陪伴他的家守。
