                    <p>
                        牠們盤踞於熱氣蒸騰的硫磺谷間，視線所及盡是芒草乘著濃霧飄飄晃晃，舒適安逸。 
                    <p> 
                        下游伺機而入的牠與山石相互掩映，汲取河裡夾雜的那一絲香氣。
                    </p> 
                    
                    <p>
                        彼らは湯気の立つ硫黄の谷間に居座り、視界には芒が濃い霧に乗ってゆらゆらと揺れ、居心地が良さそうだった。
                    <p> 
                        下流で彼が石で姿を覆い隠し、川に混じってる微かな香りを汲み取っている。
                        
                    </p>
