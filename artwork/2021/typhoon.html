                        風雨欲來，不安的氛圍從細微處開始湧動，細細雨絲悄聲入侵一片祥和的客家庄，屏氣等待，放眼望去只見大風警示般張狂。
                    </p>
                      山雨は来らんと欲し、不安な雰囲気で不穏な空気が漂い始め、静かに霧雨が平和な村にしとしとと侵入してくる。
                      そして息を殺して、見渡す限り荒れ狂う風がそれを警告している。
